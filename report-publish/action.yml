name: report-publish
description: >-
  Tell Grafana Cloud which build of an image :latest now is, so an alert can
  say when the host isn't running it.

# One sample per image over Grafana Cloud's Influx line-protocol endpoint
# (curl; no dependencies): when, and the build's place in the repository's
# history (report.sh). Two uses, both in a job in the repository's
# `publish` environment, which holds the two secrets and is limited to the
# default branch (STANDARDS.md, Container images):
#
# - `names`: the step after the one that moves :latest, for the images it
#   just moved;
# - `latest-of`: a daily scheduled job, after a registry login, for what
#   :latest is now: it repairs a report that was missed.
#
# The job needs `contents: read` (the commit's place in history comes from
# GitHub's API with the job's token), and for `latest-of`, `packages: read`.
# A failed report fails the job: the image is published either way, and a
# re-run (or the next scheduled run) reports it.
inputs:
  names:
    description: >-
      The images this run just made :latest, by the name of the container
      that runs each on the host (the image's last path component),
      space-separated.
    required: false
    default: ""
  latest-of:
    description: >-
      Instead of names: image repositories (ghcr.io/owner/name),
      space-separated. Reports what each one's :latest is now, by its
      org.opencontainers.image.revision label.
    required: false
    default: ""
  version:
    description: "With names: the build, as the host reports it. Default: the commit's first 7 characters."
    required: false
    default: ""
  url:
    description: The Influx write endpoint (secrets.GRAFANA_PUBLISH_URL).
    required: true
  auth:
    description: "<instance id>:<token>, a metrics:write token (secrets.GRAFANA_PUBLISH_AUTH)."
    required: true

runs:
  using: composite
  steps:
    - name: Tell Grafana Cloud what :latest now is
      shell: bash
      env:
        REPORT_NAMES: ${{ inputs.names }}
        REPORT_LATEST_OF: ${{ inputs.latest-of }}
        REPORT_VERSION: ${{ inputs.version }}
        REPORT_URL: ${{ inputs.url }}
        REPORT_AUTH: ${{ inputs.auth }}
        GH_TOKEN: ${{ github.token }}
        ACTION_PATH: ${{ github.action_path }}
      run: bash "$ACTION_PATH/report.sh"
