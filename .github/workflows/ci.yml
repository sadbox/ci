# sadbox/ci's own CI: lint.yml on this repository (its workflows, scripts,
# tool Dockerfile and the fixtures under testdata/), and go.yml in both
# modes against the fixture service testdata/gosvc on both architectures.
# Every PR and every push to main; no path filter, so each job can be a
# required check.
name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    uses: ./.github/workflows/lint.yml
    permissions:
      contents: read
    with:
      ansible-directory: testdata/ansible

  # Docker mode: testdata/gosvc's Dockerfile `test` target.
  go-docker:
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read
    with:
      context: testdata/gosvc

  # setup-go mode: the version from go.mod, and the newest stable Go.
  go-setup-go:
    uses: ./.github/workflows/go.yml
    permissions:
      contents: read
    with:
      go-versions: '["testdata/gosvc/go.mod", "stable"]'
      modules: testdata/gosvc

  # The scripts' own failure paths, which the fixtures above (clean by
  # design) never reach.
  selftest:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7.1.0
        with:
          go-version-file: testdata/gosvc/go.mod
          cache: false

      - name: scripts/selftest.sh
        run: bash scripts/selftest.sh

      # The action as a caller runs it (action.yml and its wiring, and the
      # commit's place in history from GitHub's real API, which selftest.sh
      # can't reach), against the same local listener.
      - name: A listener for report-publish
        id: listener
        run: |
          python3 testdata/report-publish/listen.py "$RUNNER_TEMP/got" 204 >"$RUNNER_TEMP/port" &
          for _ in $(seq 50); do
            if [ -s "$RUNNER_TEMP/port" ]; then break; fi
            sleep 0.1
          done
          echo "url=http://127.0.0.1:$(cat "$RUNNER_TEMP/port")/write" >>"$GITHUB_OUTPUT"

      - name: report-publish, as a caller runs it
        uses: ./report-publish
        with:
          names: gosvc other-svc
          url: ${{ steps.listener.outputs.url }}
          auth: 1:not-a-secret

      - name: What the listener got
        run: |
          cat "$RUNNER_TEMP/got"
          for name in gosvc other-svc; do
            grep -Eqx "sadbox_image_published,name=${name},version=${GITHUB_SHA:0:7} timestamp_seconds=[0-9]{10},commits=[1-9][0-9]*" "$RUNNER_TEMP/got"
          done
