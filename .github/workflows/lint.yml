# The linters and vulnerability checks for everything but Go (STANDARDS.md,
# Other languages), run only where they apply: a detect step looks at the
# repository's tracked files, and each linter is a step of the `lint` job,
# skipped when there is nothing for it. One job, not one per linter: each
# job bills at least a minute and most linters take seconds. Every
# applicable linter runs even after another fails, and the job fails if any
# did; the failing step names the linter.
#
# Sharing a runner is safe because no step there runs the repository's or
# its dependencies' code on the host: every tool runs in a container with
# the checkout mounted read-only, except npm, whose container writes
# node_modules into the checkout (and eslint runs the repository's config),
# so npm comes last. ansible runs on the host (uv installs, the
# repository's plugins, ansible-lint), so it keeps a job of its own: there
# it could forge only its own result.
#
#   actionlint, zizmor    always (every repository has workflows)
#   binaries              always: a tracked file git takes for binary must be
#                         declared `binary` in .gitattributes, and be no
#                         larger than binary-max-bytes
#   shellcheck            *.sh/*.bash/*.ksh/*.dash and sh/bash shebangs
#   hadolint              Dockerfiles
#   ruff                  *.py
#   osv-scanner           every uv.lock
#   npm                   every package-lock.json: npm audit --omit=dev,
#                         npm audit signatures, and eslint where configured
#   ansible               the ansible-directory: --syntax-check, ansible-lint
#   tofu                  *.tf/*.tofu: tofu fmt -check, and in each root (a
#                         directory with a .terraform.lock.hcl) tofu init
#                         -backend=false -lockfile=readonly and tofu validate;
#                         tflint in every directory with *.tf files
#   actions-lock          .github/workflows/actions.lock: gh actions-lock --verify
#
# Tool versions are pinned in sadbox/ci (tools/Dockerfile for the tool
# images, tools/ansible for ansible-lint; Dependabot bumps both), which
# this workflow fetches at its own commit. Configuration: the *-config
# input if set, else the repository's own file where the tool looks for
# it, else sadbox/ci's configs/.
name: lint

on:
  workflow_call:
    inputs:
      skip:
        description: >-
          Linters not to run, whitespace- or comma-separated: actionlint,
          zizmor, binaries, shellcheck, hadolint, ruff, osv-scanner, npm,
          eslint, ansible, tofu, actions-lock.
        type: string
        default: ""
      exclude:
        description: An extended regular expression; tracked paths matching it are not linted.
        type: string
        default: ""
      binary-max-bytes:
        description: The largest a binary file declared in .gitattributes may be, in bytes.
        type: number
        default: 5242880
      ansible-directory:
        description: The ansible directory (its ansible.cfg, playbooks, and pyproject.toml/uv.lock if it has them).
        type: string
        default: ansible
      ansible-playbooks:
        description: >-
          The playbooks to --syntax-check, whitespace-separated, relative to
          ansible-directory. Default: its top-level *.yml/*.yaml files that
          name hosts or import playbooks.
        type: string
        default: ""
      actionlint-config:
        description: An actionlint configuration, relative to the repository root.
        type: string
        default: ""
      zizmor-config:
        description: A zizmor configuration, relative to the repository root.
        type: string
        default: ""
      zizmor-online:
        description: Run zizmor's online audits (with the job's read-only token).
        type: boolean
        default: true
      hadolint-config:
        description: A hadolint configuration, relative to the repository root.
        type: string
        default: ""
      ansible-lint-config:
        description: An ansible-lint configuration, relative to the repository root.
        type: string
        default: ""
      tflint-config:
        description: A tflint configuration, relative to the repository root.
        type: string
        default: ""
      go-exempt:
        description: >-
          Go module directories not required to be checked by go.yml
          (whitespace-separated), each a deviation recorded in sadbox/ci's
          STANDARDS.md. Not affected by skip or exclude.
        type: string
        default: ""
    outputs:
      linters:
        description: The linters that ran, as a JSON list.
        value: ${{ jobs.lint.outputs.linters }}

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      EXCLUDE: ${{ inputs.exclude }}
      ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
    outputs:
      ansible: ${{ steps.detect.outputs.ansible }}
      linters: ${{ steps.detect.outputs.linters }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch sadbox/ci at this workflow's commit
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$CI_REPO" ] || [ -z "$CI_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          git init -q "$RUNNER_TEMP/sadbox-ci"
          git -C "$RUNNER_TEMP/sadbox-ci" fetch -q --depth 1 "https://github.com/$CI_REPO" "$CI_SHA"
          git -C "$RUNNER_TEMP/sadbox-ci" checkout -q FETCH_HEAD
          echo "sadbox/ci at $CI_REPO@$CI_SHA"

      - name: Detect
        id: detect
        env:
          SKIP: ${{ inputs.skip }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/detect.sh"

      # Each linter's steps run when detect chose it, whatever failed before
      # (!cancelled()); a failed detect leaves every output empty, so none run.
      - name: actionlint
        if: ${{ !cancelled() && steps.detect.outputs.actionlint == 'true' }}
        env:
          ACTIONLINT_CONFIG: ${{ inputs.actionlint-config }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" actionlint

      - name: zizmor
        if: ${{ !cancelled() && steps.detect.outputs.zizmor == 'true' }}
        env:
          ZIZMOR_CONFIG: ${{ inputs.zizmor-config }}
          ZIZMOR_ONLINE: ${{ inputs.zizmor-online }}
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" zizmor

      - name: actions-lock (gh actions-lock --verify)
        if: ${{ !cancelled() && steps.detect.outputs.actions-lock == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" actions-lock

      - name: binaries (declared in .gitattributes)
        if: ${{ !cancelled() && steps.detect.outputs.binaries == 'true' }}
        env:
          BINARY_MAX_BYTES: ${{ inputs.binary-max-bytes }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" binaries

      # Not one of detect's linters, so skip can't turn it off: every Go
      # module is checked by go.yml, or is a recorded deviation.
      - name: go-workflow (every Go module checked by go.yml)
        if: ${{ !cancelled() && steps.detect.outcome == 'success' }}
        env:
          GO_EXEMPT: ${{ inputs.go-exempt }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/go-workflow.sh"

      - name: shellcheck
        if: ${{ !cancelled() && steps.detect.outputs.shellcheck == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" shellcheck

      - name: hadolint
        if: ${{ !cancelled() && steps.detect.outputs.hadolint == 'true' }}
        env:
          HADOLINT_CONFIG: ${{ inputs.hadolint-config }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" hadolint

      - name: ruff check
        if: ${{ !cancelled() && steps.detect.outputs.ruff == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" ruff

      - name: osv-scanner on uv.lock
        if: ${{ !cancelled() && steps.detect.outputs.osv-scanner == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" osv-scanner

      # No credentials, state or backend: validate runs with -backend=false,
      # and the providers are only the ones each root's lockfile pins.
      - name: tofu fmt -check
        if: ${{ !cancelled() && steps.detect.outputs.tofu == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" tofu-fmt

      - name: tofu validate (each root)
        if: ${{ !cancelled() && steps.detect.outputs.tofu == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" tofu-validate

      - name: tflint
        if: ${{ !cancelled() && steps.detect.outputs.tofu == 'true' }}
        env:
          TFLINT_CONFIG: ${{ inputs.tflint-config }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" tflint

      # Last: npm's container writes node_modules into the checkout, and
      # eslint runs the repository's config there (see the top).
      - name: npm ci (no scripts)
        if: ${{ !cancelled() && steps.detect.outputs.npm == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" npm-ci

      - name: npm audit --omit=dev
        if: ${{ !cancelled() && steps.detect.outputs.npm == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" npm-audit

      - name: npm audit signatures
        if: ${{ !cancelled() && steps.detect.outputs.npm == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" npm-signatures

      - name: eslint (where configured)
        if: ${{ !cancelled() && steps.detect.outputs.eslint == 'true' }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/lint.sh" eslint

  # On the host, so on a runner of its own (see the top).
  ansible:
    needs: lint
    if: ${{ !cancelled() && needs.lint.outputs.ansible == 'true' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      ANSIBLE_DIRECTORY: ${{ inputs.ansible-directory }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Fetch sadbox/ci at this workflow's commit
        env:
          CI_REPO: ${{ job.workflow_repository }}
          CI_SHA: ${{ job.workflow_sha }}
        run: |
          if [ -z "$CI_REPO" ] || [ -z "$CI_SHA" ]; then
            echo "::error::job.workflow_repository or job.workflow_sha is empty"
            exit 1
          fi
          git init -q "$RUNNER_TEMP/sadbox-ci"
          git -C "$RUNNER_TEMP/sadbox-ci" fetch -q --depth 1 "https://github.com/$CI_REPO" "$CI_SHA"
          git -C "$RUNNER_TEMP/sadbox-ci" checkout -q FETCH_HEAD
          echo "sadbox/ci at $CI_REPO@$CI_SHA"

      - name: uv and the locked environments
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/ansible.sh" setup

      - name: ansible-playbook --syntax-check
        env:
          ANSIBLE_PLAYBOOKS: ${{ inputs.ansible-playbooks }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/ansible.sh" syntax

      - name: ansible-lint
        if: ${{ !cancelled() }}
        env:
          ANSIBLE_LINT_CONFIG: ${{ inputs.ansible-lint-config }}
        run: bash "$RUNNER_TEMP/sadbox-ci/scripts/ansible.sh" lint
